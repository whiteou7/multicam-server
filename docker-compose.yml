services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "0.0.0.0:3000:3000"
      - "0.0.0.0:40100-40199:40100-40199/udp"
      - "0.0.0.0:40100-40199:40100-40199/tcp"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DATABASE_PATH: /app/data/multicam.sqlite3
      UPLOAD_TMP_DIR: /app/data/upload-tmp
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-multicam-videos}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-192.168.1.6}
      MEDIASOUP_RTC_MIN_PORT: 40100
      MEDIASOUP_RTC_MAX_PORT: 40199
    volumes:
      - backend-data:/app/data
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio-data:
  backend-data:
